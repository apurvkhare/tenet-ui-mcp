name: Ingest tenet-ui

# The three triggers of DESIGN.md §10, all running the same idempotent command:
#   - repository_dispatch `tenet-ui-released`: sent by tenet-ui's release workflow (needs DS_MCP_REPO_TOKEN there)
#   - schedule: the registry watch (every 6 hours, ingests any version not yet snapshotted)
#   - workflow_dispatch: by hand, optionally for one version with --force
# A successful ingest commits the new snapshot to main; the server image is built from this repo.
on:
  repository_dispatch:
    types: [tenet-ui-released]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to ingest (default: every new version)'
        required: false
      force:
        description: 'Re-ingest even if the snapshot exists'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write # start CI (and with it the Worker deploy) on the snapshot commit

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 25 # up to 10 of them waiting for npm to serve a just-published version
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # release-asset download, higher API rate limit
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # gh workflow run
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The release dispatch arrives seconds after `npm publish`, before the registry serves the new
      # version ("may take a few minutes to become available"). Wait for it instead of failing.
      - name: Wait for the version on the registry
        env:
          VERSION: ${{ github.event.client_payload.version || github.event.inputs.version }}
        run: |
          if [ -z "$VERSION" ]; then exit 0; fi
          for i in $(seq 1 20); do
            if curl -fsS "${NPM_REGISTRY:-https://registry.npmjs.org}/tenet-ui" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s);process.exit(p.versions[process.argv[1]]||p["dist-tags"][process.argv[1]]?0:1)})' "$VERSION"; then
              echo "tenet-ui@$VERSION is on the registry"; exit 0
            fi
            echo "tenet-ui@$VERSION not on the registry yet (attempt $i/20), waiting 30s"
            sleep 30
          done
          echo "::error::tenet-ui@$VERSION did not appear on the registry within 10 minutes"
          exit 1
      - name: Ingest
        run: |
          VERSION="${{ github.event.client_payload.version || github.event.inputs.version }}"
          if [ -n "$VERSION" ]; then
            npm run ingest -- "$VERSION" ${{ github.event.inputs.force == 'true' && '--force' || '' }}
          else
            npm run ingest -- --new   # one pass of the registry watch
          fi
      - name: Commit the snapshot
        run: |
          git config user.name "tenet-ui-mcp ingest"
          git config user.email "ingest@users.noreply.github.com"
          git add snapshots
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "snapshots: ingest $(node -p "require('./snapshots/index.json').latest") ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push
          # A push made with GITHUB_TOKEN starts no `push` workflows; workflow_dispatch is allowed.
          gh workflow run ci.yml --ref main
