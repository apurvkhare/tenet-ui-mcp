name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The ingest workflow starts this after committing a snapshot: its own pushes do not trigger `push`.
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Snapshot index parses and every listed version exists
        run: |
          node -e '
            const fs = require("node:fs");
            const idx = JSON.parse(fs.readFileSync("snapshots/index.json", "utf8"));
            for (const [v, e] of Object.entries(idx.versions)) {
              const m = JSON.parse(fs.readFileSync(`snapshots/${e.dir}/manifest.json`, "utf8"));
              if (m.version !== v) throw new Error(`${v}: manifest says ${m.version}`);
              for (const f of m.files) if (!fs.existsSync(`snapshots/${e.dir}/${f}`)) throw new Error(`${v}: missing ${f}`);
            }
            console.log(`ok: ${Object.keys(idx.versions).length} snapshot(s), latest ${idx.latest}`);
          '

  # The Worker (src/worker/). Every green main deploys, so a new snapshot
  # goes live minutes after its ingest. Skipped until the CLOUDFLARE_API_TOKEN secret exists.
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OAUTH_KV_ID: ${{ vars.OAUTH_KV_ID }}
      DESIGNS_KV_ID: ${{ vars.DESIGNS_KV_ID }}
      WORKERS_SUBDOMAIN: ${{ vars.WORKERS_SUBDOMAIN }}
    steps:
      - name: Skip without Cloudflare credentials
        id: creds
        run: echo "ok=${{ env.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.creds.outputs.ok == 'true'
      - run: npm run deploy
        if: steps.creds.outputs.ok == 'true'
      - name: Health check
        if: steps.creds.outputs.ok == 'true'
        run: curl -fsS "https://tenet-ui-mcp.${WORKERS_SUBDOMAIN}.workers.dev/healthz"
